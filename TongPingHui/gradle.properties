# ---------------------------------------------------------------------------
# JVM 参数（腾讯 SDK 依赖较多，内存给小了容易 OOM）
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# ⚠️ 关键：必须让 Gradle 用 JDK 17 运行
#
# 本机系统环境变量 JAVA_HOME 指向 IntelliJ 自带的 JBR（D:\IntelliJ IDEA 2026.1.1\jbr），
# 那是 JDK 25.0.2，而 Gradle 8.x 最高只支持到 Java 23，不指定就会报：
#   "Found invalid Gradle JVM configuration / JDK 25.0.2 isn't compatible with Gradle 8.13"
#
# 如果你的 JDK 17 不在下面这个路径，改成实际路径；
# 或者删掉本行，改在 IDE 里指定：
#   Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK → 选 17
# ---------------------------------------------------------------------------
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
